name: UI tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build
      - name: Install Chromium for Playwright
        run: pwsh tests/LearnLoop.UiTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run the UI tests (the app starts inside the test run)
        run: dotnet test --no-build --logger trx --results-directory TestResults
      - name: Upload results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            tests/LearnLoop.UiTests/bin/Debug/net10.0/playwright-traces
